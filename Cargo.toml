cargo-features = ["codegen-backend"]
[package]
name = "wallpaper_carousel"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
ask_llm = { version = "2.2.2", default-features = false }
clap = { version = "^4", features = ["derive"] }
color-eyre = "^0.6.5"
config = "^0.15"
derive-new = "^0"
libc = "^0.2"
miette = "^7"
rand = "^0.9"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "^0.1"
v_utils = { version = "2.17.5", features = ["tracing", "cli", "xdg"] }
xdg = "^3"

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"

[lints.rust]
unused_features = "allow"
